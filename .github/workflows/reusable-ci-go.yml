name: Reusable CI (Go)

on:
  workflow_call:
    inputs:
      services:
        description: >
          JSON array string of cmd/ subdirectory names to build into
          container images, e.g. '["gateway","auth"]'. Single-binary repos
          pass a one-element array, e.g. '["worker"]'.
        required: true
        type: string
      publish-image:
        required: false
        type: boolean
        default: true
    secrets:
      PLATFORM_READ_TOKEN:
        description: >
          Fine-grained PAT (Contents: Read-only) scoped to jieun-platform —
          needed to checkout it cross-repo for the base-schema migration
          step below, since jieun-platform is private and the default
          GITHUB_TOKEN can't see other private repos. Not required when
          the repo under test already IS jieun-platform (its own default
          token can check itself out).
        required: false

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # NOTE: the `services:` block starts containers before any step runs —
    # including the "Load centralized tool versions" step below — so it
    # cannot reference ${{ env.POSTGRES_VERSION }}/${{ env.REDIS_VERSION }}
    # from versions.env. These image tags are hardcoded and must be updated
    # by hand if versions.env's POSTGRES_VERSION/REDIS_VERSION ever change.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jieun
          POSTGRES_PASSWORD: jieun
          POSTGRES_DB: jieun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        # Host port 16379, not the container's own 6379 — every repo's
        # test helpers hardcode localhost:16379 with no env-var fallback
        # (matching local dev's shifted-port convention, jieun-deploy's
        # docker-compose.yml), so CI's Redis has to answer on that same
        # host port rather than the plain default. Real failure hit live:
        # "dial tcp [::1]:16379: connect: connection refused" once
        # Postgres-side fixes got far enough for Redis-backed tests to run.
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://jieun:jieun@localhost:5432/jieun_test?sslmode=disable
      REDIS_ADDR: localhost:16379
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout jieun-contracts
        uses: actions/checkout@v4
        with:
          repository: DidinSalahudin/jieun-contracts
          path: jieun-contracts

      - name: Checkout jieun-platform (base schema)
        # jieun-analyzer/jieun-clipper's own migrations reference core
        # tables (users, videos, plans) they never create themselves —
        # those live in jieun-platform's migrations, since every service
        # shares one physical Postgres in both local dev and here. A
        # repo's own isolated CI Postgres starts completely empty, so the
        # base schema has to be laid down first. Harmless no-op re-checkout
        # when the repo under test already IS jieun-platform — golang-migrate
        # tracks applied versions, so running its own migrate-up twice from
        # two checkouts of the same ref just sees "no change" the 2nd time.
        uses: actions/checkout@v4
        with:
          repository: DidinSalahudin/jieun-platform
          path: jieun-platform-base
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}

      - name: Load centralized tool versions
        # $GITHUB_ENV's file-append format only accepts KEY=VALUE lines —
        # versions.env's own explanatory # comments break it if cat'd raw
        # (real failure hit live: "Invalid format '# Single source...'").
        run: grep -v '^#' jieun-contracts/versions.env | grep -v '^$' >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: repo/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Install ffmpeg (repos with an ffmpeg wrapper only)
        # jieun-clipper's runner tests deliberately exercise a REAL ffmpeg
        # binary (no mock, matching this codebase's own no-mocks-for-
        # own-infra convention) — ubuntu-latest doesn't ship it by
        # default. Real failure hit live: "exec: ffmpeg: executable file
        # not found in $PATH".
        if: hashFiles('repo/internal/ffmpeg/*.go') != ''
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv (Python sidecar repos only)
        # jieun-analyzer's `make lint` also runs `cd python && uv run ruff
        # check .` (T-042's Python transcription sidecar) — repos without a
        # python/ dir (jieun-platform, jieun-clipper) skip this entirely.
        # Real failure hit live: "/bin/sh: 1: uv: not found".
        if: hashFiles('repo/python/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies (Python sidecar repos only)
        # pyproject.toml declares no [project.dependencies] — this
        # project's Python deps live in requirements.txt/requirements-dev.txt
        # (pip-style, predates uv adoption here), so `uv run` alone never
        # installs anything into its managed venv. Real failure hit live:
        # "error: Failed to spawn: `ruff` — No such file or directory".
        if: hashFiles('repo/python/pyproject.toml') != ''
        working-directory: repo/python
        # No --system: installs into uv's own project-scoped .venv (auto-
        # created here since pyproject.toml is present), the same venv
        # `uv run ruff` below resolves against — a --system install would
        # land in the runner's system Python instead, invisible to `uv run`.
        run: uv pip install -r requirements-dev.txt

      - name: make lint
        working-directory: repo
        run: make lint

      - name: Run jieun-platform base schema migrations + seed
        # `psql` ships preinstalled on GitHub-hosted ubuntu-latest runners.
        # seed.sql is idempotent (ON CONFLICT DO NOTHING) — the 'free' plan
        # row it inserts is required by users.plan_id's FK constraint,
        # which every repo's test fixtures rely on when creating test users.
        working-directory: jieun-platform-base
        run: |
          migrate -path migrations -database "$DATABASE_URL" up
          psql "$DATABASE_URL" -f migrations/seed.sql

      - name: Run database migrations
        # Only repos with their own migrations/ directory + make
        # migrate-up target need this (jieun-platform/analyzer/clipper do;
        # a repo without a DB, e.g. a future pure-frontend one, wouldn't).
        # Each repo's own Makefile target already appends its own
        # x-migrations-table suffix — real bug hit live: CI's Postgres
        # container starts empty every run, and without this step every
        # DB-backed test failed with "relation ... does not exist".
        working-directory: repo
        run: |
          if [ -d migrations ]; then
            make migrate-up
          fi

      - name: make test
        working-directory: repo
        run: make test

      - name: make build
        working-directory: repo
        run: make build

  publish-image:
    needs: lint-test-build
    if: ${{ inputs.publish-image && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout jieun-contracts
        uses: actions/checkout@v4
        with:
          repository: DidinSalahudin/jieun-contracts
          path: jieun-contracts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: repo
          # Named build-context maps the sibling jieun-contracts checkout
          # into the build at the same relative path each repo's go.mod
          # `replace` directive already expects (../jieun-contracts from
          # /src inside the Dockerfile == /jieun-contracts at the image
          # build root). Drop this once jieun-contracts is a real tagged
          # module dependency (T-005) and the replace directive is gone.
          build-contexts: |
            jieun-contracts=jieun-contracts
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/didinsalahudin/${{ github.event.repository.name }}-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/didinsalahudin/${{ github.event.repository.name }}-${{ matrix.service }}:latest
