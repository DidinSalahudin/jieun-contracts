name: Reusable CI (Go)

on:
  workflow_call:
    inputs:
      services:
        description: >
          JSON array string of cmd/ subdirectory names to build into
          container images, e.g. '["gateway","auth"]'. Single-binary repos
          pass a one-element array, e.g. '["worker"]'.
        required: true
        type: string
      publish-image:
        required: false
        type: boolean
        default: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # NOTE: the `services:` block starts containers before any step runs —
    # including the "Load centralized tool versions" step below — so it
    # cannot reference ${{ env.POSTGRES_VERSION }}/${{ env.REDIS_VERSION }}
    # from versions.env. These image tags are hardcoded and must be updated
    # by hand if versions.env's POSTGRES_VERSION/REDIS_VERSION ever change.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jieun
          POSTGRES_PASSWORD: jieun
          POSTGRES_DB: jieun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://jieun:jieun@localhost:5432/jieun_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout jieun-contracts
        uses: actions/checkout@v4
        with:
          repository: DidinSalahudin/jieun-contracts
          path: jieun-contracts

      - name: Load centralized tool versions
        # $GITHUB_ENV's file-append format only accepts KEY=VALUE lines —
        # versions.env's own explanatory # comments break it if cat'd raw
        # (real failure hit live: "Invalid format '# Single source...'").
        run: grep -v '^#' jieun-contracts/versions.env | grep -v '^$' >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: repo/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: make lint
        working-directory: repo
        run: make lint

      - name: Run database migrations
        # Only repos with their own migrations/ directory + make
        # migrate-up target need this (jieun-platform/analyzer/clipper do;
        # a repo without a DB, e.g. a future pure-frontend one, wouldn't).
        # Each repo's own Makefile target already appends its own
        # x-migrations-table suffix — real bug hit live: CI's Postgres
        # container starts empty every run, and without this step every
        # DB-backed test failed with "relation ... does not exist".
        working-directory: repo
        run: |
          if [ -d migrations ]; then
            make migrate-up
          fi

      - name: make test
        working-directory: repo
        run: make test

      - name: make build
        working-directory: repo
        run: make build

  publish-image:
    needs: lint-test-build
    if: ${{ inputs.publish-image && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout jieun-contracts
        uses: actions/checkout@v4
        with:
          repository: DidinSalahudin/jieun-contracts
          path: jieun-contracts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: repo
          # Named build-context maps the sibling jieun-contracts checkout
          # into the build at the same relative path each repo's go.mod
          # `replace` directive already expects (../jieun-contracts from
          # /src inside the Dockerfile == /jieun-contracts at the image
          # build root). Drop this once jieun-contracts is a real tagged
          # module dependency (T-005) and the replace directive is gone.
          build-contexts: |
            jieun-contracts=jieun-contracts
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/didinsalahudin/${{ github.event.repository.name }}-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/didinsalahudin/${{ github.event.repository.name }}-${{ matrix.service }}:latest
